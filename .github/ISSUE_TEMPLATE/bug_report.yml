name: Bug report
description: The card draws something wrong or does not load
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what the card did. A screenshot helps; hide anything you would rather keep private.
    validations:
      required: true
  - type: dropdown
    id: sensor
    attributes:
      label: Which sensor does the card read?
      options:
        - Life Dashboard integration
        - The Home Assistant Companion app
        - Fitbit, Garmin, Withings or another integration
        - Something else
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The card, Home Assistant, and the integration that gives the sensor.
      placeholder: "Card 0.1.0, Home Assistant 2026.11.1, integration 1.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
      placeholder: "Chrome on a laptop, or the Companion app on an iPhone"
  - type: textarea
    id: config
    attributes:
      label: The card's YAML
      description: From the code editor of the card. The sensor's unit and state class help too.
      render: yaml
